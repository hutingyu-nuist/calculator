# CI workflow for calculator project GitHub Actions
name: Calculator CI Pipeline

# Trigger rules: run workflow on push and pull request for main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    # Use Ubuntu latest virtual machine to run pipeline
    runs-on: ubuntu-latest
    steps:
      # Step1: Checkout source code from repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step2: Setup JDK 17, match local development environment
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step3: Compile all Java source code
      - name: Compile source code
        run: mvn clean compile

      # Step4: Execute all JUnit 5 test cases
      - name: Run JUnit unit tests
        run: mvn test
