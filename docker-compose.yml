version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: on‑failure
    environment:
      - LOG_LEVEL=INFO

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: on‑failure
    depends_on:
      - backend
